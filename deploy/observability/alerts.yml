# Generic alerts for the Strata application. Thresholds are starting points: recalibrate them against your own load
# test and error budget before relying on them.
groups:
  - name: strata-availability
    rules:
      - alert: StrataAppDown
        expr: up{job="strata-admin"} == 0
        for: 2m
        labels: { severity: critical, category: availability }
        annotations:
          summary: "Strata Admin is unreachable"
          description: "No scrape from {{ $labels.instance }} for more than 2 minutes."

      - alert: StrataAppRestarted
        expr: changes(process_start_time_seconds{job="strata-admin"}[10m]) > 0
        for: 0m
        labels: { severity: warning, category: availability }
        annotations:
          summary: "Strata Admin restarted"
          description: "The process start time changed in the last 10 minutes."

  - name: strata-http
    rules:
      - alert: High5xxErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="strata-admin",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="strata-admin"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical, category: http }
        annotations:
          summary: "HTTP 5xx error rate above 5% for 5 minutes"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{job="strata-admin"}[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning, category: http }
        annotations:
          summary: "p95 HTTP latency above 1s for 10 minutes"

  - name: strata-jvm
    rules:
      - alert: JvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{job="strata-admin",area="heap"})
          /
          sum(jvm_memory_max_bytes{job="strata-admin",area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning, category: jvm }
        annotations:
          summary: "JVM heap usage above 90% for 10 minutes"

  - name: strata-db
    rules:
      - alert: HikariPoolSaturated
        expr: hikaricp_connections_pending{job="strata-admin",pool="HikariPool-1"} > 5
        for: 5m
        labels: { severity: warning, category: database }
        annotations:
          summary: "Connection pool has pending requests"

      - alert: HikariPoolExhausted
        expr: hikaricp_connections_active{job="strata-admin",pool="HikariPool-1"} >= hikaricp_connections_max{job="strata-admin",pool="HikariPool-1"}
        for: 2m
        labels: { severity: critical, category: database }
        annotations:
          summary: "Connection pool is exhausted"
