global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: strata-admin
    metrics_path: /actuator/prometheus
    static_configs:
      # The reference deployment exposes the management port on 127.0.0.1:8081 on the host.
      # Inside a compose network use the app service name and its management port instead.
      - targets: ["host.docker.internal:8081"]
        labels:
          instance: strata-admin
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
