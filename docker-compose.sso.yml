name: strata-demo

# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.sso.yml up --build
# Opens the demo admin console with "Continue with Keycloak" (demo / demo123).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./deploy/keycloak/strata-realm.json:/opt/keycloak/data/import/strata-realm.json:ro

  backend:
    environment:
      SPRING_APPLICATION_JSON: >-
        {"strata":{"social":{"enabled":true,"state-store":"redis",
        "allowed-redirect-uris":["http://localhost:3001/sso-callback"],
        "providers":{"keycloak":{"display-name":"Keycloak",
        "issuer-uri":"http://localhost:8082/realms/strata",
        "authorization-endpoint":"http://localhost:8082/realms/strata/protocol/openid-connect/auth",
        "token-endpoint":"http://keycloak:8080/realms/strata/protocol/openid-connect/token",
        "user-info-endpoint":"http://keycloak:8080/realms/strata/protocol/openid-connect/userinfo",
        "client-id":"strata-admin","client-secret":"strata-demo-secret",
        "roles-claim":"groups","role-mappings":{"strata-admins":"admin"},"auto-provision":true}}}}}
    depends_on:
      keycloak:
        condition: service_started