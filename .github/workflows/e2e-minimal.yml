name: E2E · minimal app + admin console

# Heavy browser test, kept out of the fast PR gate: boots the open-source minimal application with PostgreSQL and
# drives the exported admin console with Playwright (login → dashboard → users).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U strata -d strata"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Build the minimal application
        working-directory: strata
        run: mvn -B -pl examples/strata-minimal-app -am -DskipTests package
      - name: Start the minimal application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/strata
          STRATA_JWT_SECRET: strata-e2e-secret-at-least-32-characters-long
          STRATA_ADMIN_PASSWORD: strata-e2e-admin-password
        run: |
          cd strata
          java -jar examples/strata-minimal-app/target/strata-minimal-app-*.jar > /tmp/strata-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::minimal application did not become healthy"; tail -100 /tmp/strata-e2e.log; exit 1
      - name: Install the admin console
        working-directory: strata-ui
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: strata-ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the E2E suite
        working-directory: strata-ui
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:8080
          E2E_ADMIN_PASSWORD: strata-e2e-admin-password
        run: |
          pnpm exec vite --port 5173 --strictPort > /tmp/strata-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 2
          done
          pnpm exec playwright test --config playwright.minimal.config.ts --reporter=list
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/strata-e2e.log
            /tmp/strata-ui.log
            strata-ui/test-results
          if-no-files-found: ignore