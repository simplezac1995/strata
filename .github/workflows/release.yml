name: Release · Maven Central

# Publishes the framework artifacts to Maven Central when a v* tag is pushed. The same job can be started manually
# with the `dry-run` input (default true): it builds, signs and uploads the SBOM artifact without deploying.
# Everything that requires network-only plugins (enforcer, SBOM, sources, javadoc, GPG, Central publishing) lives in
# the `release` Maven profile, so ordinary offline/CI builds stay fast and dependency-free.
#
# Required repository secrets:
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  - Central Portal token user/password
#   GPG_PRIVATE_KEY                      - ASCII-armored private key
#   GPG_PASSPHRASE                       - key passphrase

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + SBOM only, no deploy"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # setup-java writes these env var names into the generated settings.xml; without the mapping the upload
      # reaches the Portal with empty credentials and fails with 401.
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Import the release GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons

      - name: Tag must match the project version
        if: github.event_name == 'push'
        run: |
          VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version -f strata/pom.xml)
          echo "project version: $VERSION"
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Release tags must point at a non-SNAPSHOT version (found $VERSION)"
            exit 1
          fi
          if [[ "v$VERSION" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version $VERSION"
            exit 1
          fi

      - name: Build, sign and generate SBOM
        run: mvn -B -Prelease -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE" verify
        working-directory: strata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: strata/target/bom.json
          if-no-files-found: error

      - name: Attach the SBOM to the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Strata $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" strata/target/bom.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Deploy to Maven Central
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: mvn -B -Prelease -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE" deploy
        working-directory: strata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
