name: Release · Maven Central

# Publishes the framework artifacts to Maven Central when a v* tag is pushed.
# Everything that requires network-only plugins (enforcer, SBOM, sources, javadoc, GPG, Central publishing)
# lives in the `release` Maven profile, so ordinary offline/CI builds stay fast and dependency-free.
#
# Required repository secrets:
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  - Central Portal token user/password
#   GPG_PRIVATE_KEY                      - ASCII-armored private key
#   GPG_PASSPHRASE                       - key passphrase

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + SBOM only, no deploy"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Tag must match the project version
        run: |
          VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version -f strata/pom.xml)
          echo "project version: $VERSION"
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Release tags must point at a non-SNAPSHOT version (found $VERSION)"
            exit 1
          fi
          if [[ "v$VERSION" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version $VERSION"
            exit 1
          fi

      - name: Build, sign and generate SBOM
        run: mvn -B -Prelease -DskipTests verify
        working-directory: strata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: strata/target/bom.json
          if-no-files-found: error

      - name: Deploy to Maven Central
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: mvn -B -Prelease -DskipTests deploy
        working-directory: strata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
