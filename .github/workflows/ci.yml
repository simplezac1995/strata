name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consistency:
    name: Consistency · repository policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Policy gates
        run: |
          node scripts/verify-java-runtime.mjs
          node scripts/verify-file-size.mjs
          node scripts/verify-spdx.mjs
          node scripts/verify-no-private-data.mjs

  backend:
    name: Backend · Maven verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [25]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U strata -d strata"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and verify
        working-directory: strata
        run: mvn -B verify
      - name: Coverage summary
        working-directory: strata
        run: node ../scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: strata/**/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
      - name: Generated docs are up to date
        run: node scripts/generate-config-reference.mjs --check

  # ── Runtime compatibility: the published bytecode targets Java 21 ──────────────────────────────
  runtime-java-21:
    name: Runtime · Java 21
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U strata -d strata"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25 build toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build the minimal app (Java 21 bytecode)
        working-directory: strata
        run: mvn -B -pl examples/strata-minimal-app -am -DskipTests package
      - name: Set up Java 21 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start the built application on Java 21
        env:
          STRATA_JWT_SECRET: ci-java21-runtime-secret-at-least-32-chars
          STRATA_ADMIN_PASSWORD: CiJava21AdminPassword2026
          STRATA_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:5173
          STRATA_WORKER_ID: "1"
          STRATA_DB_HOST: 127.0.0.1
          STRATA_DB_PORT: "5432"
          STRATA_DB_NAME: strata
          STRATA_DB_USER: strata
          STRATA_DB_PASSWORD: strata
          STRATA_REDIS_HOST: 127.0.0.1
          STRATA_REDIS_PORT: "6379"
        run: |
          java -version
          java -jar strata/examples/strata-minimal-app/target/strata-minimal-app-*.jar --server.port=18080 > /tmp/java21-app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/v3/api-docs > /dev/null; then
              echo "Java 21 runtime OK"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/java21-app.log
          exit 1

  admin:
    name: Admin UI · pnpm check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strata-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: strata-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm check

  release-dry-run:
    name: Release · SBOM, sources, javadoc (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build release artifacts (GPG skipped)
        working-directory: strata
        run: mvn -B -Prelease -DskipTests -Dgpg.skip=true package
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: strata/target/bom.json
          if-no-files-found: error
