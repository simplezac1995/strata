# Keep the exported framework's dependencies current from day one.
version: 2
updates:
  - package-ecosystem: maven
    directory: /strata
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /strata-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
