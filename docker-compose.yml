name: strata-demo

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - strata-db:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/strata
      SPRING_DATASOURCE_USERNAME: strata
      SPRING_DATASOURCE_PASSWORD: strata
      STRATA_JWT_SECRET: strata-demo-only-jwt-secret-at-least-32-chars
      STRATA_ADMIN_PASSWORD: demo-admin-password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    ports:
      - "${STRATA_API_PORT:-8080}:8080"

  ui:
    build:
      context: ./strata-ui
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${STRATA_UI_PORT:-3001}:80"

volumes:
  strata-db: